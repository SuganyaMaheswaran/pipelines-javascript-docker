apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: node-app
        image: $(containerRegistry)/pipelines-javascript-docker:$(tag)
        ports:
        - containerPort: 8080
